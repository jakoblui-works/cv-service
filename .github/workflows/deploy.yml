name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    uses: ./.github/workflows/ci.yml
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: >
          docker build
          -t ghcr.io/jakoblui-works/cv-service:${{ github.sha }}
          -t ghcr.io/jakoblui-works/cv-service:latest .
      - name: Smoke test image
        run: >
          docker run --rm -e REDIS__PASSWORD=x
          ghcr.io/jakoblui-works/cv-service:${{ github.sha }}
          python -c "import app.core.broker, app.health.tasks"
      - name: Push
        run: |
          docker push ghcr.io/jakoblui-works/cv-service:${{ github.sha }}
          docker push ghcr.io/jakoblui-works/cv-service:latest
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_DISPATCH_TOKEN }}
        run: |
          gh api repos/jakoblui-works/infra/dispatches -f event_type=deploy
