name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    uses: ./.github/workflows/ci.yml
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/jakoblui-works/cv-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: >
          docker run --rm \
            -e REDIS__PASSWORD=x \
            -e S3__ENDPOINT_URL=http://localhost:3900 \
            -e S3__ACCESS_KEY_ID=x \
            -e S3__SECRET_ACCESS_KEY=x \
            -e S3__BUCKET=x \
            -e DATABASE__HOST=localhost \
            -e DATABASE__USER=postgres \
            -e DATABASE__PASSWORD=postgres \
            -e DATABASE__NAME=site_db \
            -e CONTACT__EMAIL=ci-dummy@example.com \
            -e "CONTACT__PHONE=+45 00 00 00 00" \
            -e CONTACT__LINKEDIN=https://www.example.com/in/ci-dummy \
            ghcr.io/jakoblui-works/cv-service:${{ github.sha }} \
            sh -c "python -c 'import app.core.broker, app.health.tasks' && xelatex --version && fc-list | grep -qi heros && python -m scripts.smoke_check"
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jakoblui-works/cv-service:${{ github.sha }}
            ghcr.io/jakoblui-works/cv-service:latest
          cache-from: type=gha
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_DISPATCH_TOKEN }}
        run: |
          gh api repos/jakoblui-works/infra/dispatches -f event_type=deploy
