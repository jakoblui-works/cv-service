- id: technical-lead
  label: Technical Lead
  profile: >-
    Software engineer and technical lead, most drawn to the whole problem: how a system should be built, deployed, and
    kept reliable as it grows. Background running from CI/CD and deployment architecture through developer tooling to
    production machine learning. Recently led engineering at an AI-native ESG platform, redesigning the release process
    and infrastructure while growing the team to 6.
  emphasis:
    [leadership, architecture, devops, testing, technical-leadership, software-architecture, ci-cd, python, typescript]

