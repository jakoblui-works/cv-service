    architecture and infrastructure.
  emphasis: [frontend, product, testing, react, typescript, ux-ui, software-architecture, api-design, ci-cd]

- id: platform-engineer
  label: Platform Engineer
  profile: >-
    Software engineer and technical lead focused on the infrastructure that keeps products running: deployment
    workflows, cloud environments and internal tooling. Linux as primary OS for almost 10 years. Recently led
    engineering at an AI-native ESG platform, replacing a three-week release cycle with rolling releases and rewriting
    much of the cloud infrastructure. Brings a full-stack developer's understanding of the applications being operated.
  emphasis:
    [
      devops,
      security,
      ci-cd,
      deployment-architecture,
      docker,
      linux,
      developer-tooling,
      developer-experience,
      production-systems,
      automated-testing,
    ]

- id: technical-product-owner
  label: Technical Product Owner
  profile: >-
    Technical lead moving into product ownership, drawn to the whole problem: what to build, how it fits the existing
    system, and why it matters to users. Experienced in turning customer feedback and business needs into clear
    priorities, modernising legacy systems and leading development teams. Technically fluent in APIs, integrations and
    data flows, and at home translating between customers, stakeholders and developers.
  emphasis: [product, leadership, prioritisation, stakeholder-communication, customer-feedback, data-flows]
