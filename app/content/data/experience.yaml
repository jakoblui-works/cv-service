        Led product development with broad ownership across product direction, architecture, infrastructure and
        engineering, while establishing a more structured development organisation.
    - text: >-
        Led development with broad ownership across architecture, infrastructure and engineering, and rewrote much of
        the platform's cloud infrastructure.
