  promotion_note: Promoted from Full-Stack Developer to Lead Product Developer in Mar. 2026, after 6 months.
  roles:
    - {title: Lead Product Developer, start: 2026-03-01, end: 2026-08-01}
    - {title: Full-Stack Developer, start: 2025-09-01, end: 2026-02-01}
  bullets:
    - id: rbac-permission-system
      priority: 2
      variants:
        - text: >-
            Replaced the legacy permission system with RBAC, resolving longstanding security issues while supporting
            more flexible organisation structures and simpler access management.
          tags: [security, backend, architecture, software-architecture, api-design]
        # initiative angle
        - text: >-
            Investigated customer access needs, uncovered a significant security gap, and replaced the legacy
            permission system with RBAC, making access management both more secure and more flexible.
          tags: [security, product, access-control-security, legacy-system-modernisation] # review
          highlights:
            - text: uncovered a significant security gap
              tags: [security] # proposed
        # short
        - text: >-
            Uncovered a significant security gap in the legacy permission system and replaced it with RBAC, closing the
            gap while simplifying access management.
          tags: [security, access-control-security] # review

    - id: extraction-evaluation-framework
      priority: 2
      variants:
        - text: >-
            Developed an evaluation framework for the AI document-extraction pipeline - test corpus, fuzzy matching,
            accuracy and latency reporting - to catch regressions when changing prompts or models.
          tags: [ai-ml, testing, llm-document-extraction, evaluation-regression-testing, python]
        # outcome angle
        - text: >-
            Developed an evaluation framework for the AI document-extraction pipeline, measuring accuracy and latency
            against a test corpus so prompt and model changes could be adopted with confidence.
          tags: [ai-ml, testing, evaluation-regression-testing] # review
        # customer angle
        - text: >-
            Built an evaluation framework for the AI document-extraction pipeline, so prompt and model changes were
            measured on accuracy and latency before reaching customers.
          tags: [ai-ml, product, evaluation-regression-testing] # review

    - id: rolling-release-deployment
      priority: 3
      variants:
        - text: >-
            Redesigned deployment around rolling releases, replacing a coordinated 3-week schedule with independent
            deploys. Cut deployment time from a developer-day to 10–20 minutes and let any developer ship to
            production unaided.
          tags: [devops, architecture, ci-cd, docker, docker-swarm, github-actions, production-systems]
          highlights:
            - text: a developer-day to 10–20 minutes
              tags: [devops, ci-cd] # review
        # ownership angle
        - text: >-
            Redesigned deployment around rolling releases, replacing a coordinated 3-week schedule with independent
            deploys, so each developer could own a feature from planning to production. Cut deployment time from a
            developer-day to 10–20 minutes.
          tags: [devops, leadership, release-management] # review
          highlights:
            - text: a developer-day to 10–20 minutes
              tags: [devops, leadership] # proposed
        # ops angle
        - text: >-
            Redesigned deployment around rolling releases, replacing a coordinated 3-week schedule with independent
            deploys: pipelines that run unattended, deployment steps that fail loudly and specifically, and monitoring
            that shows what went wrong. Cut deployment time from a developer-day to 10–20 minutes and let any
            developer ship to production unaided.
          tags: [devops, ci-cd, deployment-architecture, production-systems] # review
          highlights:
            - text: a developer-day to 10–20 minutes
              tags: [devops, ci-cd] # proposed
        # customer angle
        - text: >-
            Moved from a coordinated three-week release cycle to rolling releases, so new features reached customers
            immediately and each developer could own a feature from planning to production. Cut deployment time from a
            developer-day to 10–20 minutes.
          tags: [product, devops, release-management] # review
          highlights:
            - text: new features reached customers immediately
              tags: [product] # proposed

