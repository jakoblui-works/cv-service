# Jobs in reverse-chronological order; roles within a job newest first. Dates are the 1st of the month.
# Each bullet is one achievement with one or more phrasings (`variants`); the first variant is the default. Likewise
# the first entry of `descriptions` is the default. A highlight's `text` is a substring of its variant's text.
# Tags are a first pass — review. `# review` marks tag choices made during conversion; `# proposed` marks highlight
# candidates that did not exist as a metric before.
- id: acembee
  company: Acembee
  employment: Full Time
  location: Copenhagen, Denmark
  tagline: AI-native ESG platform that extracts data from unstructured documents to generate LCA reports.
  descriptions:
