# Jobs in reverse-chronological order; roles within a job newest first. Dates are the 1st of the month.
# Each bullet is one achievement with one or more phrasings (`variants`); the first variant is the default. Likewise
# the first entry of `descriptions` is the default. A highlight's `text` is a substring of its variant's text.
# Tags work on two levels: `Bullet.tags` is what the achievement demonstrates (true of every phrasing) and decides
# whether it is selected; a variant's `tags` is only the audience angle of that phrasing and decides which phrasing is
# used, so the default variant has none. Highlight tags describe the highlighted phrase itself.
