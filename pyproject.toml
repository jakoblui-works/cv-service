[project]
name = "cv-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.12.21"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]  # errors, pyflakes, import sorting — a reasonable starting set
extend-select = ["ANN"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["F401"]
